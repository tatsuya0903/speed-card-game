name: Deploy Pages (manual)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: '公開承認済み・mainのCI成功コミット（40桁SHA）'
        required: true
        type: string

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful CI for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '40桁のコミットSHAが必要です'; exit 1; }
          gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&event=push&branch=main&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          jq -e --arg sha "$TARGET_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")]
            | sort_by(.run_number) | last
            | .status == "completed" and .conclusion == "success"
          ' "$RUNNER_TEMP/ci-runs.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require commit on main
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Use pinned npm
        run: npm install --global "npm@$(node -p 'require("./package.json").volta.npm')"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
